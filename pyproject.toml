[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cyto-manifold"
version = "0.1.0"
description = "Single-cell and spatial transcriptomics platform integrating RNA velocity splicing kinetics, diffusion pseudotime manifolds, Leiden community clustering, spatial ligand-receptor signaling, and regulatory network inference"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "ZengLLQ" },
]
keywords = [
    "single-cell-transcriptomics",
    "spatial-transcriptomics",
    "rna-velocity",
    "bioinformatics",
    "computational-biology",
    "diffusion-pseudotime",
    "leiden-clustering",
    "cell-cell-communication",
    "gene-regulatory-networks",
    "genomics",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "flake8>=7.0",
    "mypy>=1.8",
]

[project.scripts]
cyto-manifold = "cyto_manifold.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.mypy]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
