name: CytoManifold CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Bytecode compilation check
        run: python -m compileall -q src

      - name: Lint check with flake8
        run: flake8 src tests examples --max-line-length=120 --extend-ignore=E203

      - name: Static type check with mypy
        run: mypy src

      - name: Run pytest suite
        run: pytest -v

      - name: CLI smoke tests
        run: |
          cyto-manifold --help
          cyto-manifold demo --cells 180 --genes 60 --seed 42
          python -m cyto_manifold.cli simulate --cells 120 --genes 45 --seed 7
          python -m cyto_manifold.cli analyze --cells 150 --genes 50 --seed 11
          python -m cyto_manifold.cli velocity --cells 160 --genes 50 --mode dynamical --seed 13
          python -m cyto_manifold.cli spatial --cells 160 --genes 50 --permutations 30 --seed 17
          python -m cyto_manifold.cli benchmark --cells 180 --genes 60 --seed 21

      - name: Run standalone examples
        run: |
          python examples/01_single_cell_qc_leiden_manifold.py
          python examples/02_rna_velocity_dynamical_splicing.py
          python examples/03_spatial_tissue_moran_and_signaling.py
          python examples/04_dpt_absorbing_fate_and_grn.py
          python examples/05_end_to_end_benchmark_sensitivity.py
